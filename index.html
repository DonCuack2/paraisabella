<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flores para Isabella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ef;--bg2:#ffc2dc;--paper:#fff7fa;--ink:#6b1f45;--accent:#e0206f;--soft:#ff9ccb;--line:#ffb3d3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2b0b1d;--bg2:#44102e;--paper:#3a0f29;--ink:#ffdcec;--accent:#ff5fa2;--soft:#ff8fc1;--line:#8a2a5c}
}
:root[data-theme="dark"]{--bg1:#2b0b1d;--bg2:#44102e;--paper:#3a0f29;--ink:#ffdcec;--accent:#ff5fa2;--soft:#ff8fc1;--line:#8a2a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:1.2rem;line-height:1.5;
  background:
    radial-gradient(circle at 15% 10%,var(--soft) 0,transparent 38%),
    radial-gradient(circle at 90% 85%,var(--soft) 0,transparent 40%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  padding:clamp(12px,3vw,32px);
}
.letter{
  max-width:1240px;margin:0 auto;background:var(--paper);
  border:2px solid var(--accent);border-radius:22px;
  box-shadow:inset 0 0 0 7px var(--paper),inset 0 0 0 8px var(--line),0 18px 50px rgba(224,32,111,.28);
  padding:clamp(22px,4vw,48px);text-align:center;
}
h1{font-family:'Pinyon Script','Brush Script MT',cursive;font-weight:400;font-size:clamp(3rem,9vw,5.2rem);line-height:1.05;margin:.1em 0 .1em;color:var(--accent);text-shadow:0 2px 18px rgba(255,61,139,.35)}
.sub{max-width:34em;margin:0 auto 1.2rem;font-style:italic}
.garden{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(14px,3vw,30px);margin-top:1rem}
.unit{display:flex;flex-direction:column;align-items:center;position:relative}
.unit svg{width:100%;max-width:230px;height:auto;overflow:visible;transition:filter 1.2s}
.unit.done svg{filter:drop-shadow(0 0 14px rgba(255,61,139,.6))}
.petal{cursor:pointer;outline:none}
.petal:hover ellipse{filter:brightness(1.12)}
.petal:focus-visible ellipse{stroke:#fff;stroke-width:3}
.unit.done .petal{pointer-events:none;cursor:default}
.card{
  width:100%;min-height:9.5em;margin-top:.4rem;padding:.9rem 1rem;border-radius:14px;
  border:1.5px dashed var(--line);display:flex;flex-direction:column;justify-content:center;
}
.card .hint{font-style:italic;opacity:.75;margin:0}
.card .msg{display:none;margin:0}
.unit.done .card{border:1.5px solid var(--accent);background:linear-gradient(160deg,rgba(255,156,203,.22),rgba(255,61,139,.1))}
.unit.done .hint{display:none}
.unit.done .msg{display:block;animation:rise 1.4s ease both}
.msg h2{font-family:'Pinyon Script','Brush Script MT',cursive;font-weight:400;font-size:2rem;line-height:1.1;margin:0 0 .25rem;color:var(--accent)}
.msg p{margin:0;font-weight:600;font-style:italic}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.finale{
  max-width:34em;margin:1.8rem auto 0;font-family:'Pinyon Script','Brush Script MT',cursive;font-size:clamp(1.7rem,4.5vw,2.4rem);
  line-height:1.3;color:var(--accent);opacity:0;transform:translateY(8px);transition:opacity 1.6s,transform 1.6s;min-height:3.9em
}
.finale.on{opacity:1;transform:none}
button{
  margin-top:1.2rem;font:inherit;font-weight:600;color:var(--accent);background:transparent;
  border:1.5px solid var(--accent);border-radius:999px;padding:.35rem 1.2rem;cursor:pointer
}
button:hover{background:var(--accent);color:var(--paper)}
button:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.heart{position:absolute;pointer-events:none;color:var(--accent);font-size:1.3rem;left:50%;top:38%;will-change:transform,opacity}
</style>
</head>
<body>
<main class="letter">
  <h1>Para Isabella</h1>
  <p class="sub">Estas flores se marchitaron, pero todavía se pueden salvar. Toca un pétalo de cada una y escucha lo que quiero decirte.</p>
  <section id="garden" class="garden" aria-label="Flores marchitas"></section>
  <p id="finale" class="finale" aria-live="polite"></p>
  <button id="reset" type="button">Marchitar de nuevo</button>
</main>

<script>
const FLOWERS=[
  {t:"Perdón",m:"Perdóname por las veces que dejé que el orgullo hablara más fuerte que mi cariño. Contigo quiero escuchar primero y defender después. Hoy elijo cuidarte."},
  {t:"Lo que fuimos",m:"Recuerdo cómo nos reíamos sin motivo y cómo el tiempo volaba a tu lado. Eso no se marchitó: solo esperaba que lo regáramos otra vez."},
  {t:"Lo que viene",m:"Quiero un nosotros con paciencia, abrazos largos y conversaciones honestas. Si tú quieres, empecemos de nuevo, flor por flor."},
  {t:"Mi perdón más sincero",m:"Perdón por las palabras que dolieron y por los silencios que dejaron huecos. No quiero que olvides lo que pasó. Espero que mis acciones te demuestren el cambio que he hecho y que el amor que siento por ti es real."}
];
const FINAL="Cuatro flores, cuatro promesas. Lo que parecía marchito solo necesitaba cariño para volver a florecer.";

const NS="http://www.w3.org/2000/svg";
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return "rgb("+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(",")+")"};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=x=>Math.max(0,Math.min(1,x));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

const WILT=["#a98a93","#b89aa2","#9d8089"], BRIGHT=["#ff3d8b","#ff6fb0","#ff9ccb"];
const GROUND=[[38,286,70],[158,292,-30],[72,297,110]];
const garden=document.getElementById("garden"),finale=document.getElementById("finale");
const units=[];

FLOWERS.forEach((f,idx)=>{
  const u=document.createElement("div");u.className="unit";
  const svg=el("svg",{viewBox:"0 0 200 310",role:"img","aria-label":"Flor marchita "+(idx+1)});
  el("ellipse",{cx:100,cy:300,rx:70,ry:7,fill:"rgba(107,31,69,.18)"},svg);
  const stem=el("path",{fill:"none","stroke-linecap":"round","stroke-width":5},svg);
  const leafL=el("ellipse",{cx:0,cy:-22,rx:8,ry:24},el("g",{},svg));
  const leafR=el("ellipse",{cx:0,cy:-22,rx:8,ry:24},el("g",{},svg));
  const gL=leafL.parentNode,gR=leafR.parentNode;
  const fallen=GROUND.map(()=>el("ellipse",{rx:15,ry:32,opacity:1},svg));
  const head=el("g",{},svg);
  const petals=[];
  for(let i=0;i<9;i++){
    const g=el("g",{class:"petal",tabindex:0,role:"button","aria-label":"Pétalo "+(i+1)+" de la flor "+(idx+1)},head);
    el("ellipse",{cx:0,cy:-30,rx:15,ry:32,stroke:"rgba(255,255,255,.55)","stroke-width":1},g);
    petals.push(g);
  }
  const center=el("circle",{cx:0,cy:0},head);
  const shine=el("circle",{cx:-3,cy:-3,r:4,fill:"#fff"},head);
  center.style.pointerEvents="none";shine.style.pointerEvents="none";

  const card=document.createElement("div");card.className="card";
  card.innerHTML='<p class="hint">Toca un pétalo para devolverle la vida</p><div class="msg"><h2></h2><p></p></div>';
  card.querySelector("h2").textContent=f.t;card.querySelector("p.msg, .msg p").textContent=f.m;
  u.append(svg,card);garden.appendChild(u);

  const S={u,done:false,render};
  function render(t){
    const hx=lerp(160,100,t),hy=lerp(205,92,t);
    stem.setAttribute("d","M100 292 C100 "+lerp(175,205,t)+" "+lerp(150,100,t)+" "+lerp(110,150,t)+" "+hx+" "+hy);
    stem.setAttribute("stroke",mix("#7d7a55","#2fb36a",t));
    leafL.setAttribute("fill",mix("#8c8a62","#42c97a",t));leafR.setAttribute("fill",mix("#8c8a62","#42c97a",t));
    gL.setAttribute("transform","translate(100 262) rotate("+(-lerp(80,42,t))+")");
    gR.setAttribute("transform","translate(100 238) rotate("+lerp(75,42,t)+")");
    head.setAttribute("transform","translate("+hx+" "+hy+") rotate("+lerp(115,0,t)+") scale("+lerp(.85,1,t)+")");
    petals.forEach((g,i)=>{
      const ab=i*40,w=(ab>180?ab-360:ab)*.3+((i%2)?8:-8);
      const ang=lerp(w,ab,t);
      let sx=lerp(.8,1,t),sy=lerp(.7,1,t);
      if(i%3===0){const s=clamp((t-.75)/.25);sx=sy=s}
      g.setAttribute("transform","rotate("+ang+") scale("+sx+" "+sy+")");
      const e=g.firstChild;e.setAttribute("fill",mix(WILT[i%3],BRIGHT[i%3],t));
      g.setAttribute("opacity",lerp(.85,1,t));
    });
    center.setAttribute("r",lerp(9,13,t));center.setAttribute("fill",mix("#6e4b45","#ffc857",t));
    shine.setAttribute("opacity",t*.7);
    fallen.forEach((p,j)=>{
      const a=j*120*Math.PI/180,ex=100+Math.sin(a)*30,ey=92-Math.cos(a)*30;
      const g=GROUND[j],x=lerp(g[0],ex,t),y=lerp(g[1],ey,t)-Math.sin(Math.PI*t)*60;
      p.setAttribute("transform","translate("+x+" "+y+") rotate("+lerp(g[2],j*120,t)+") scale(.9)");
      p.setAttribute("fill",mix(WILT[j],BRIGHT[j],t));
      p.setAttribute("opacity",t<.75?1:clamp(1-(t-.75)/.2));
    });
  }
  S.render=render;
  petals.concat([]).forEach(g=>{
    const go=()=>bloom(S);
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
  fallen.forEach(p=>{p.style.cursor="pointer";p.addEventListener("click",()=>bloom(S))});
  render(0);units.push(S);
});

function hearts(u){
  if(reduce)return;
  for(let i=0;i<16;i++){
    const h=document.createElement("span");h.className="heart";h.textContent=i%2?"♥":"✿";
    h.style.left=(30+Math.random()*40)+"%";
    u.appendChild(h);
    const dx=(Math.random()-.5)*160,dy=-(60+Math.random()*130);
    h.animate([{transform:"translate(0,0) scale(.4)",opacity:0},{opacity:1,offset:.2},{transform:"translate("+dx+"px,"+dy+"px) scale("+(.8+Math.random()*.9)+")",opacity:0}],
      {duration:1600+Math.random()*1200,delay:i*70,easing:"ease-out"}).onfinish=()=>h.remove();
  }
}

function bloom(S){
  if(S.done)return;S.done=true;
  S.u.querySelectorAll(".petal").forEach(g=>g.setAttribute("tabindex","-1"));
  const dur=reduce?300:2400,t0=performance.now();
  (function step(now){
    const k=clamp((now-t0)/dur);S.render(ease(k));
    if(k<1)requestAnimationFrame(step);else{S.u.classList.add("done");hearts(S.u);checkAll()}
  })(t0);
}
function checkAll(){
  if(units.every(s=>s.done)){finale.textContent=FINAL;requestAnimationFrame(()=>finale.classList.add("on"))}
}
document.getElementById("reset").addEventListener("click",()=>{
  units.forEach(s=>{s.done=false;s.u.classList.remove("done");s.render(0);
    s.u.querySelectorAll(".petal").forEach(g=>g.setAttribute("tabindex","0"))});
  finale.classList.remove("on");finale.textContent="";
});
</script>
</body>
</html>
